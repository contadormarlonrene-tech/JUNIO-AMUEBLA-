services:
  - type: web
    name: amuebla-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: amuebla-db
          property: connectionString

databases:
  - name: amuebla-db
    databaseName: amuebla
    user: amuebla_user
    plan: free
